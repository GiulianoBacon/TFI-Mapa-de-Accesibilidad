<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mapa de Accesibilidad Colaborativo</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
        <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
        <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    </head>
    <body>
        <div id="header-placeholder"></div>
        <div>
           <div class="button-container">
    <i class="fas fa-search search-icon"></i>

    <input
        id="busqueda"
        type="text"
        placeholder="Buscar dirección, calle o establecimiento..."
        onInput="handleInputChange()"
        onkeydown="if(event.key==='Enter') handleSearch()"
        class="form-control"
    />

    <button onClick="handleSearch()" class="search-btn">
        Buscar
    </button>
</div>
            <ul id="suggestions" class="suggestions-list"></ul>
        </div>
        <div id="map" class="map"></div>
        <div class="layer-toggles">
            <label><input type="checkbox" id="toggleEstablecimientos" checked onchange="toggleLayer('establecimientos')"> Establecimientos</label>
            <label><input type="checkbox" id="toggleVeredas" checked onchange="toggleLayer('veredas')"> Veredas</label>
        </div>
        <div id="sidebar" class="sidebar">
            <button id="closeSidebar" class="btn btn-sm btn-secondary" style="float: right;">Cerrar</button>
            <div id="sidebar-content"></div>
        </div>
        
        <!-- Modal de selección para Establecimiento o Vereda -->
        <div class="modal" id="modalSelection" role="dialog" style="display: none;">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Selecciona el tipo de opinión</h5>
                        <button type="button" class="close" id="closeModalSelection">&times;</button>
                    </div>
                    <div class="modal-body">
                        <p>¿Quieres registrar una opinión de Establecimiento o Vereda?</p>
                        <button id="optionEstablishment" class="btn btn-primary">Establecimiento</button>
                        <button id="optionSidewalk" class="btn btn-secondary">Vereda</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal de formulario de Opinión -->
        <div class="modal" id="modalAddOpinion" role="dialog" style="display: none;">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-body">
                        <form onSubmit="addOpinion_establecimiento(event)">
                            <div class="form-group">
                                <button id="closeModalAddOpinion" type="button" class="close" data-dismiss="modal">&times;</button>
                                <div class="form-group row">
                                    <label for="latitud" class="col-sm-2 col-form-label">Latitud:</label>
                                    <div class="col-sm-4">
                                        <input type="text" readonly class="form-control-plaintext" name="latitud" id="latitud" value="latitud">
                                    </div>
                                    <label for="longitud" class="col-sm-2 col-form-label">Longitud:</label>
                                    <div class="col-sm-4">
                                        <input type="text" readonly class="form-control-plaintext" name="longitud" id="longitud" value="longitud">
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Nombre del establecimiento:</label>
                                <input type="text" name="nombre_establecimiento" id="nombreEstablecimiento" class="form-control" />
                            </div>

                            <div class="form-group">
                                <label>Descripción espacios:</label>
                                <div class="float-right">
                                    <label>¿Los espacios son aptos?</label>
                                    <input type="checkbox" name="espacios_aptos"/>
                                </div>
                                <input type="text" name="descripcion_espacios" class="form-control"/>
                            </div>

                            <div class="form-group">
                                <label>Descripción ascensor:</label>
                                <div class="float-right">
                                    <label>¿El ascensor es apto?</label>
                                    <input type="checkbox" name="ascensor_apto"/>
                                </div>
                                <input type="text" name="descripcion_ascensor" class="form-control"/>
                            </div>

                            <div class="form-group">
                                <label>¿Baños Aptos?</label>
                                <input type="checkbox" name="baños_aptos"/>
                            </div>

                            <div class="form-group">
                                <label>¿Puerta Apta?</label>
                                <input type="checkbox" name="puerta_apta"/>
                            </div>

                            <div class="form-group">
                                <label>Descripción rampa interna:</label>
                                <div class="float-right">
                                    <label>¿La rampa interna es apta?</label>
                                    <input type="checkbox" name="rampa_interna_apta"/>
                                </div>
                                <input type="text" name="descripcion_rampa_interna" class="form-control"/>
                            </div>

                            <div class="form-group">
                                <label>Descripción rampa externa:</label>
                                <div class="float-right">
                                    <label>¿La rampa externa es apta?</label>
                                    <input type="checkbox" name="rampa_externa_apta"/>
                                </div>
                                <input type="text" name="descripcion_rampa_externa" class="form-control"/>
                            </div>

                            <div class="form-group">
                                <label for="puntaje">Puntaje:</label>
                                <select name="puntaje" id="puntaje" class="form-control" required>
                                    <option value="">Seleccione un puntaje</option>
                                    <option value="1">1 — Muy malo</option>
                                    <option value="2">2 — Malo</option>
                                    <option value="3">3 — Regular</option>
                                    <option value="4">4 — Bueno</option>
                                    <option value="5">5 — Excelente</option>
                                </select>
                            </div>

                            <button type="submit" class="float-right btn btn-success"> Enviar </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal de formulario de Opinión de Vereda -->
<div class="modal" id="modalAddOpinionVereda" role="dialog" style="display: none;">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-body">
                <form onSubmit="addOpinion_vereda(event)">
                    <div class="form-group">
                        <button id="closeModalAddOpinionVereda" type="button" class="close">&times;</button>
                        <div class="form-group row">
                            <label for="latitud_vereda" class="col-sm-2 col-form-label">Latitud:</label>
                            <div class="col-sm-4">
                                <input type="text" readonly class="form-control-plaintext" name="latitud_vereda" id="latitud_vereda">
                            </div>
                            <label for="longitud_vereda" class="col-sm-2 col-form-label">Longitud:</label>
                            <div class="col-sm-4">
                                <input type="text" readonly class="form-control-plaintext" name="longitud_vereda" id="longitud_vereda">
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group row">
                        <div class="col-sm-8">
                            <label>Dirección detectada:</label>
                            <input type="text" name="direccion_vereda" id="direccion_vereda" class="form-control" placeholder="Buscando..." readonly required />
                        </div>
                        <div class="col-sm-4">
                            <label>Altura:</label>
                            <input type="text" name="altura_vereda" id="altura_vereda" class="form-control" placeholder="Ej: 1234" />
                        </div>
                    </div>
                    <hr>

                    <div class="form-group">
                        <label>¿La vereda es apta?</label>
                        <input type="checkbox" name="vereda_apta" />
                    </div>
                    <div class="form-group">
                        <label>Descripción:</label>
                        <input type="text" name="descripcion_vereda" class="form-control" />
                    </div>
                    <button type="submit" class="float-right btn btn-success">Enviar</button>
                </form>
            </div>
        </div>
    </div>
</div>

        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
        <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-geometryutil/0.10.0/leaflet.geometryutil.min.js"></script> -->
        <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
        <script src="mapa.js"></script>
        <script src="header.js"></script>
        <script>
            loadHeader().then(() => {
                initMap()
            });
        </script>
    </body>
</html>
