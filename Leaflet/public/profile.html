<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Accesibilidad Colaborativo</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
          crossorigin="anonymous">
</head>
<body>

    <div id="header-placeholder"></div>

    <div class="container mt-5 mb-5" style="max-width: 900px; display: block;">

        <!-- Perfil -->
        <div class="card shadow-sm border-0 rounded-3 mb-5 bg-white">
            <div class="card-body text-center">
                <h3 id="profile-username" class="card-title mb-1">Cargando...</h3>
                <p id="profile-email" class="text-muted">Cargando email...</p>
            </div>
        </div>

        <!-- Título -->
        <h4 class="mb-4 text-center font-weight-bold">Mis opiniones</h4>

        <!-- Filtros -->
        <div class="text-center mb-4">
            <button id="btn-todas"
                    class="btn btn-primary mr-2 filtro-opinion"
                    onclick="filtrarOpiniones('todas')">
                Todas
            </button>

            <button id="btn-establecimiento"
                    class="btn btn-outline-primary mr-2 filtro-opinion"
                    onclick="filtrarOpiniones('establecimiento')">
                Establecimientos
            </button>

            <button id="btn-vereda"
                    class="btn btn-outline-primary filtro-opinion"
                    onclick="filtrarOpiniones('vereda')">
                Veredas
            </button>
        </div>

        <!-- Lista de opiniones -->
        <div id="opinions-list" class="d-flex flex-column gap-3">
            <div class="text-center text-muted">
                Cargando opiniones...
            </div>
        </div>

    </div>

    <div id="footer-placeholder"></div>

    <script src="header.js"></script>
    <script src="footer.js"></script>
    <script src="profile.js"></script>

    <script>
        loadHeader();
    </script>

</body>
</html>
