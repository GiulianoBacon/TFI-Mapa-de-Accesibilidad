<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta — Mapa de Accesibilidad Colaborativo</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
</head>
<body>
    <div id="header-placeholder"></div>
    <section class="banner">
        <div class="form-banner-wrapper">
            <div class="card text-center card-custom form-banner-card">
          <div class="card-header">
            Crear cuenta
          </div>
          <div class="card-body">
            <div class="input-group mb-3">
              <span class="input-group-text">Email:</span>
              <input type="email" id="email" class="form-control" placeholder="Ingrese su dirección de email">
            </div>
            <div class="input-group mb-3">
              <span class="input-group-text">Contraseña:</span>
              <input type="password" id="password" class="form-control" placeholder="Ingrese su contraseña">
            </div>
            <div class="input-group mb-3">
              <span class="input-group-text">Confirmar Contraseña:</span>
              <input type="password" id="confirm-password" class="form-control" placeholder="Confirme su contraseña">
            </div>
            <div class="input-group mb-3">
              <span class="input-group-text">Usuario:</span>
              <input type="text" id="username" class="form-control" placeholder="Ingrese su usuario">
            </div>
            <button class="btn-hero" id="register-button" onClick="handleRegistrar()" style="width: 100%; border: 1px solid #ddd; cursor: pointer;">Registrar</button>
          </div>
        </div>
    </div>
    </section>

    <div id="footer-placeholder"></div>

    <script src="signup.js"></script>
    <script src="header.js"></script>
    <script src="footer.js"></script>
    <script>
        loadHeader();
        loadFooter();
    </script>
</body>
</html>
